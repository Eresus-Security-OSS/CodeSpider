# =============================================================================
# CodeSpider - 24/7 Agentic Gitea/Forgejo/GitHub PR Reviewer Configuration
# Copy to codespider.yaml or pass via:
#   ./codespider -f codespider.yaml
#   CODESPIDER_CONFIG_PATH=/etc/codespider/codespider.yaml ./codespider
#
# Optional: reference environment variables using ${VAR_NAME}
# =============================================================================

server:
  listen_addr: ":8080"
  # Optional: protect /, /status, /metrics, /events, and /api/dry-run
  # admin_token: "${CODESPIDER_ADMIN_TOKEN}"

forge:
  provider: "gitea" # gitea (default) or github
  # Optional allowlist for periodic reconciliation; empty discovers accessible repos.
  # repos:
  #   - my-org/my-repo
  skip_draft_prs: true
  ignore_bot_prs: true
  sticky_summary: true
  require_collaborator_for_fix: true

gitea:
  base_url: "https://gitea.example.com"
  token: "replace-with-gitea-bot-token"
  webhook_secret: "replace-with-webhook-hmac-secret"
  bot_username: "codespider"
  allow_unsigned_webhooks: false
  allow_same_owner_cross_repo: false
  # cross_repo_allowlist:
  #   - my-org/shared-contracts

# To use GitHub instead, set forge.provider to "github", configure the GitHub
# credentials and webhook secret below, and remove/comment out the gitea block.
# Configure a GitHub webhook for pull_request, issue_comment, and
# pull_request_review_comment events, with application/json content type and
# this endpoint as its target: http(s)://<codespider-host>:8080/webhook
#github:
#  api_url: "https://api.github.com" # GitHub Enterprise Server: https://host/api/v3
#  token: "${CODESPIDER_GITHUB_TOKEN}"
#  webhook_secret: "${CODESPIDER_GITHUB_WEBHOOK_SECRET}"
#  bot_username: "codespider[bot]"
# For automatic GitHub App token creation and refresh, configure these instead
# of github.token. Mount the PEM key as a read-only secret file.
#  app_id: 123456
#  installation_id: 987654321
#  app_private_key_path: "/run/secrets/codespider-github-app.pem"

llm:
  base_url: "https://api.openai.com/v1"
  api_key: "replace-with-llm-api-key"
  model: "gpt-5"
  # fast_model: "gpt-5-mini"
  timeout_seconds: 120
  max_retries: 2
  # reasoning_effort: "none"  # none|minimal|low|medium|high; sent on every request, leave unset unless your endpoint supports it

agent:
  max_steps: 12
  # job_timeout_seconds: 300  # per-PR job budget (30-7200); raise for slow self-hosted models
  max_tokens_per_run: 32000
  skills_dir: "./skills"
  default_skills:
    - security
    - code-quality
    - testing
    # - performance
    # - concurrency
    # - chaos-resilience
  enable_write: false
  adversarial_security: true
  enable_proof_of_bug: false

sandbox:
  mode: "disabled" # set to "container" to enable isolated container PoC testing
  runtime: "docker"
  image: "golang:1.26-trixie"

# alert:
#   webhook_url: "${CODESPIDER_ALERT_WEBHOOK_URL}"

daemon:
  data_dir: "./data"
  workers: 2
  reconcile_interval_seconds: 300
  # update_check_hours: 24  # opt in to periodic release checks (outbound call to api.github.com); 0 = off
  log_level: "info"
